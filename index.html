function escHtml(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return escHtml(s).replace(/"/g,'&quot;'); }
function catBy(slug){ return CATEGORIES.find(c=>c.slug===slug); }
function money(v){
  if (typeof v === 'number') return '$' + v.toLocaleString('es-CO', {maximumFractionDigits:0});
  return escHtml(v);
}
function roundedCompra(v){
  if (typeof v === 'number') return Math.round(v / 10000) * 10000;
  return v;
}
function discountPct(compra, venta){
  if (typeof compra === 'number' && typeof venta === 'number' && compra > venta) {
    return Math.round((1 - venta/compra) * 100);
  }
  return null;
}
function estadoLabel(score){
  if (score >= 9.5) return 'Excelente estado';
  if (score >= 8.5) return 'Muy buen estado';
  if (score >= 7) return 'Buen estado';
  return 'Estado funcional';
}

function fitOrientation(img, container){
  const run = () => {
    if (!img.naturalWidth || !img.naturalHeight) return;
    if (img.naturalWidth > img.naturalHeight) {
      container.style.aspectRatio = img.naturalWidth + ' / ' + img.naturalHeight;
      img.style.objectFit = 'contain';
      img.style.backgroundColor = 'var(--cream)';
    } else {
      container.style.aspectRatio = '';
      img.style.objectFit = '';
      img.style.backgroundColor = '';
    }
  };
  if (img.complete) run();
  img.addEventListener('load', run);
}

function fitAllIn(root){
  root.querySelectorAll('.img-wrap').forEach(wrap => {
    const img = wrap.querySelector('img.fit-img');
    if(img) fitOrientation(img, wrap);
  });
}

function buildNav(){
  const links = CATEGORIES.map(c => `<a href="#cat-${c.slug}" class="hover:text-ink transition">${escHtml(c.nombre)}</a>`).join('');
  document.getElementById('desktopNav').innerHTML = links;
  document.getElementById('mobileNav').innerHTML = CATEGORIES.map(c => `<a href="#cat-${c.slug}" class="block py-3 border-b border-black/5">${escHtml(c.nombre)}</a>`).join('');
}

function conditionSeal(estado, size){
  if(!estado) return '';
  const dims = size === 'lg' ? 'w-14 h-14' : 'w-12 h-12';
  return `<div class="${dims} rounded-full bg-white/95 shadow-md border border-black/5 flex flex-col items-center justify-center -rotate-6 flex-shrink-0">
    <span class="font-display font-bold leading-none text-[13px]">${estado.score}</span>
    <span class="text-[6px] uppercase tracking-wide text-ink/45 leading-none mt-0.5">de ${estado.max}</span>
  </div>`;
}

function productCard(p, opts){
  opts = opts || {};
  const cover = p.imagenes[0] || '';
  return `
  <a href="#p/${p.categoria}/${p.slug}" class="group block bg-white rounded-[24px] shadow-sm hover:shadow-xl transition-shadow duration-300 overflow-hidden${opts.small ? ' w-full sm:w-60 flex-shrink-0' : ' mb-6 break-inside-avoid'}">
    <div class="relative img-wrap overflow-hidden" style="aspect-ratio:4/5">
      <img src="${cover}" loading="lazy" class="fit-img w-full h-full object-cover rounded-t-[20px] transition-transform duration-500 group-hover:scale-105" alt="${escAttr(p.nombre)}">
      <div class="absolute top-3 left-3">${conditionSeal(p.estado)}</div>

    <div class="p-5">

      <p class="text-sm uppercase tracking-wide text-ink/55 mt-1 line-clamp-2">${escHtml(p.descripcion)}</p>
    </div>
  </a>`;
}

  let html = '';

  CATEGORIES.forEach(cat => {
    const items = PRODUCTS.filter(p => p.categoria === cat.slug);

    const textSub = cat.light ? 'text-white/75' : 'text-ink/55';
    html += `
    <section id="cat-${cat.slug}" class="px-6 sm:px-10 lg:px-16 py-12 sm:py-16 lg:py-20 scroll-mt-20" style="background:${cat.color}">

          <h2 class="font-display text-3xl sm:text-4xl font-semibold ${textMain}">${escHtml(cat.nombre)}</h2>

        <div class="columns-1 sm:columns-2 lg:columns-3 xl:columns-4 gap-6">
          ${items.map(p => productCard(p)).join('')}
        </div>
      </div>
    </section>`;
  });

  document.getElementById('app').innerHTML = html;
  fitAllIn(document.getElementById('app'));
  CURRENT_GALLERY = [];
  setMainIdx = null;

let CURRENT_GALLERY = [];
let CURRENT_IDX = 0;

  const p = PRODUCTS.find(x => x.categoria === catSlug && x.slug === slug);

const menuBtn = document.getElementById('menuBtn');
const mobileNav = document.getElementById('mobileNav');
const menuBar1 = document.getElementById('menuBar1');
const menuBar2 = document.getElementById('menuBar2');

function setMenuOpen(open){
  mobileNav.classList.toggle('hidden', !open);
  mobileNav.classList.toggle('flex', open);
  menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if(menuBar1 && menuBar2){
    menuBar1.style.transform = open ? 'translateY(3.5px) rotate(45deg)' : '';
    menuBar2.style.transform = open ? 'translateY(-3.5px) rotate(-45deg)' : '';
  }
}

menuBtn.addEventListener('click', () => {
  const isOpen = !mobileNav.classList.contains('hidden');
  setMenuOpen(!isOpen);
});

function closeMobileMenu(){
  setMenuOpen(false);
}

function route(){
  const h = location.hash;
  if(h.startsWith('#p/')){
    const parts = h.slice(3).split('/');
    renderProduct(decodeURIComponent(parts[0]), decodeURIComponent(parts[1]));
  } else {
    renderHome();
    const anchor = (h && h !== '#' && h !== '#/') ? h.slice(1) : null;
    if(anchor){
      const scrollToAnchor = () => {
        const el = document.getElementById(anchor);
        if(el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
      };
      requestAnimationFrame(scrollToAnchor);
      setTimeout(scrollToAnchor, 350);
      setTimeout(scrollToAnchor, 900);
    } else {
      const scrollTop = () => window.scrollTo({top: 0, left: 0, behavior: 'instant'});
      scrollTop();
      requestAnimationFrame(scrollTop);
      setTimeout(scrollTop, 50);
    }
  }
  closeMobileMenu();
}

buildNav();
window.addEventListener('hashchange', route);
route();
</script>
